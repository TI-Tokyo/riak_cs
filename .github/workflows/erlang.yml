name: Erlang CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]


jobs:

  build:

    runs-on: debian-latest

    strategy:
      fail-fast: false
      matrix:
        otp:
          - "26"
          - "28"

    container:
      image: erlang:${{ matrix.otp }}

    steps:
      - uses: actions/checkout@v7
      - name: Compile
        run: make compile
      - name: Run checks
        run: make check
